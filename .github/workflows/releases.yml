name: Releases

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build OVA/VMware
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debos p7zip qemu-utils zerofree
          sudo rm -rf /var/lib/apt/lists/*

          docker build -t tlvm-builder .

          # Read-only source mount; writable output mount
          docker run --rm \
            --device /dev/kvm \
            --group-add "$(stat -c '%g' /dev/kvm)" \
            -v "$(pwd):/recipes:ro" \
            -v "$(pwd)/images:/images:rw" \
            -w /recipes \
            tlvm-builder ./build.sh -v virtualbox -f ova

          docker run --rm \
            --device /dev/kvm \
            --group-add "$(stat -c '%g' /dev/kvm)" \
            -v "$(pwd):/recipes:ro" \
            -v "$(pwd)/images:/images:rw" \
            -w /recipes \
            tlvm-builder ./build.sh -v vmware -f vmware

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images
          path: images/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images
          path: images

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            images/*.*
            scripts/tlosint-tools.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Shellcheck
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.sh"
      - "scripts/**"
      - "**/*.md"

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
